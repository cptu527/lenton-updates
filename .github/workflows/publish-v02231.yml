name: Publish Lenton v0.22.31

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v02231.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified build artifact
        run: |
          curl --fail --location --retry 3 \
            'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-bf14-8211-9aef-f3a67641f26c/raw?se=2026-09-05T09%3A01%3A03Z&sp=r&sv=2026-02-06&sr=b&scid=f1065d12-e1af-59aa-937d-b708611bff66&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T23%3A19%3A26Z&ske=2026-09-05T23%3A19%3A26Z&sks=b&skv=2026-02-06&sig=KrDLLTxZU2xvG3ss3QHDqk5Jn4%2Buhp9Mek11Q/muH4Y%3D' \
            --output /tmp/lenton-v02231.zip
          rm -rf /tmp/lenton-v02231
          mkdir -p /tmp/lenton-v02231
          unzip -o /tmp/lenton-v02231.zip -d /tmp/lenton-v02231
          test -f /tmp/lenton-v02231/Lenton-v0.22.31.apk
          cp /tmp/lenton-v02231/Lenton-v0.22.31.apk ./Lenton-v0.22.31.apk

      - name: Verify APK hash and publish metadata
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json
          apk=Path('Lenton-v0.22.31.apk')
          digest=hashlib.sha256(apk.read_bytes()).hexdigest()
          expected='1314a85decf8ac88098da9daf267df0c42f88a6f528385e5ad5f2b97b81710cf'
          assert digest==expected,(digest,expected)
          meta={
              'versionCode':152,
              'versionName':'0.22.31',
              'apkUrl':'https://raw.githubusercontent.com/cptu527/lenton-updates/main/Lenton-v0.22.31.apk',
              'sha256':digest,
              'notes':'모노 강조색을 검정 대신 블루그레이 #58656D로 변경 · 본문과 멘션/탭/버튼 강조를 더 쉽게 구분 · 다른 강조 색상과 v0.22.30 이하 기존 기능 유지'
          }
          Path('latest.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('published sha256:',digest)

      - name: Commit app update files
        run: |
          git config user.name 'lenton-update-bot'
          git config user.email 'lenton-update-bot@users.noreply.github.com'
          git add Lenton-v0.22.31.apk latest.json
          if git diff --cached --quiet; then
            echo 'Update files already published.'
            exit 0
          fi
          git commit -m 'Publish Lenton v0.22.31 update'
          git push
