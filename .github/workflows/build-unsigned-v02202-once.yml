name: Prepare unsigned Lenton v0.22.02

on:
  push:
    paths:
      - '.github/workflows/build-unsigned-v02202-once.yml'

permissions:
  actions: read
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'build-tools;35.0.1'

      - name: Download exact v0.22.01 unsigned base artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/cptu527/lenton-updates/actions/artifacts/9930164644/zip' \
            -o base-artifact.zip
          unzip -q base-artifact.zip
          test -f Lenton-v0.22.01-aligned-unsigned.apk

      - name: Download apktool
        shell: bash
        run: |
          curl -fL --retry 3 'https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar' -o apktool.jar

      - name: Apply only v0.22.02 expand-to-full change
        shell: bash
        run: |
          java -jar apktool.jar d -f Lenton-v0.22.01-aligned-unsigned.apk -o work
          python3 - <<'PY'
          from pathlib import Path

          root=Path('work')
          smali=root/'smali/com/mastoflow/app/MainActivity.smali'
          s=smali.read_text()

          anchor='''    invoke-virtual {v5, v14}, Landroid/widget/LinearLayout;->setBackground(Landroid/graphics/drawable/Drawable;)V\n\n    .line 1128\n'''
          insert='''    invoke-virtual {v5, v14}, Landroid/widget/LinearLayout;->setBackground(Landroid/graphics/drawable/Drawable;)V\n\n    new-instance v16, Landroid/widget/LinearLayout;\n\n    move-object/from16 v3, v16\n\n    invoke-direct {v3, v8}, Landroid/widget/LinearLayout;-><init>(Landroid/content/Context;)V\n\n    const/16 v10, 0x10\n\n    invoke-virtual {v3, v10}, Landroid/widget/LinearLayout;->setGravity(I)V\n\n    .line 1128\n'''
          assert s.count(anchor)==1
          s=s.replace(anchor,insert,1)

          old_add='''    new-instance v3, Landroid/widget/LinearLayout$LayoutParams;\n\n    const/16 v10, 0x1a\n\n    invoke-direct {v8, v10}, Lcom/mastoflow/app/MainActivity;->dp(I)I\n\n    move-result v10\n\n    const/4 v13, -0x1\n\n    invoke-direct {v3, v13, v10}, Landroid/widget/LinearLayout$LayoutParams;-><init>(II)V\n\n    invoke-virtual {v5, v14, v3}, Landroid/widget/LinearLayout;->addView(Landroid/view/View;Landroid/view/ViewGroup$LayoutParams;)V\n\n    .line 1129\n'''
          new_add='''    new-instance v3, Landroid/widget/LinearLayout$LayoutParams;\n\n    const/4 v11, 0x0\n\n    const/16 v10, 0x1a\n\n    invoke-direct {v8, v10}, Lcom/mastoflow/app/MainActivity;->dp(I)I\n\n    move-result v10\n\n    const/high16 v13, 0x3f800000    # 1.0f\n\n    invoke-direct {v3, v11, v10, v13}, Landroid/widget/LinearLayout$LayoutParams;-><init>(IIF)V\n\n    move-object/from16 v11, v16\n\n    invoke-virtual {v11, v14, v3}, Landroid/widget/LinearLayout;->addView(Landroid/view/View;Landroid/view/ViewGroup$LayoutParams;)V\n\n    const-string v3, "↗"\n\n    const/high16 v10, 0x41b00000    # 22.0f\n\n    invoke-direct/range {p0 .. p0}, Lcom/mastoflow/app/MainActivity;->sub()I\n\n    move-result v11\n\n    invoke-direct {v8, v3, v10, v11}, Lcom/mastoflow/app/MainActivity;->tv(Ljava/lang/String;FI)Landroid/widget/TextView;\n\n    move-result-object v14\n\n    const/16 v3, 0x11\n\n    invoke-virtual {v14, v3}, Landroid/widget/TextView;->setGravity(I)V\n\n    const-string v3, "전체 답글 작성창으로 확대"\n\n    invoke-virtual {v14, v3}, Landroid/widget/TextView;->setContentDescription(Ljava/lang/CharSequence;)V\n\n    const-string v3, "lenton_expand_full"\n\n    invoke-virtual {v14, v3}, Landroid/widget/TextView;->setTag(Ljava/lang/Object;)V\n\n    new-instance v3, Landroid/widget/LinearLayout$LayoutParams;\n\n    const/16 v10, 0x26\n\n    invoke-direct {v8, v10}, Lcom/mastoflow/app/MainActivity;->dp(I)I\n\n    move-result v10\n\n    const/16 v11, 0x20\n\n    invoke-direct {v8, v11}, Lcom/mastoflow/app/MainActivity;->dp(I)I\n\n    move-result v11\n\n    invoke-direct {v3, v10, v11}, Landroid/widget/LinearLayout$LayoutParams;-><init>(II)V\n\n    move-object/from16 v12, v16\n\n    invoke-virtual {v12, v14, v3}, Landroid/widget/LinearLayout;->addView(Landroid/view/View;Landroid/view/ViewGroup$LayoutParams;)V\n\n    new-instance v3, Landroid/widget/LinearLayout$LayoutParams;\n\n    const/4 v13, -0x1\n\n    const/16 v10, 0x20\n\n    invoke-direct {v8, v10}, Lcom/mastoflow/app/MainActivity;->dp(I)I\n\n    move-result v10\n\n    invoke-direct {v3, v13, v10}, Landroid/widget/LinearLayout$LayoutParams;-><init>(II)V\n\n    invoke-virtual {v5, v12, v3}, Landroid/widget/LinearLayout;->addView(Landroid/view/View;Landroid/view/ViewGroup$LayoutParams;)V\n\n    move-object/from16 v16, v14\n\n    const/16 v12, 0xc\n\n    const/4 v15, 0x6\n\n    .line 1129\n'''
          assert s.count(old_add)==1
          s=s.replace(old_add,new_add,1)

          input_anchor='''    invoke-virtual {v5, v10, v3}, Landroid/widget/LinearLayout;->addView(Landroid/view/View;Landroid/view/ViewGroup$LayoutParams;)V\n\n    .line 1130\n'''
          input_insert='''    invoke-virtual {v5, v10, v3}, Landroid/widget/LinearLayout;->addView(Landroid/view/View;Landroid/view/ViewGroup$LayoutParams;)V\n\n    new-instance v3, Lcom/mastoflow/app/MainActivity$$ExternalSyntheticLambda28;\n\n    invoke-direct {v3, v8, v10, v2}, Lcom/mastoflow/app/MainActivity$$ExternalSyntheticLambda28;-><init>(Lcom/mastoflow/app/MainActivity;Landroid/widget/EditText;Lorg/json/JSONObject;)V\n\n    move-object/from16 v11, v16\n\n    invoke-virtual {v11, v3}, Landroid/widget/TextView;->setOnClickListener(Landroid/view/View$OnClickListener;)V\n\n    .line 1130\n'''
          assert s.count(input_anchor)==1
          s=s.replace(input_anchor,input_insert,1)

          sig='.method synthetic lambda$expandInlineReplyBar$162$com-mastoflow-app-MainActivity(Landroid/widget/EditText;Lorg/json/JSONObject;Landroid/view/View;)V\n    .locals 2\n'
          sig2='.method synthetic lambda$expandInlineReplyBar$162$com-mastoflow-app-MainActivity(Landroid/widget/EditText;Lorg/json/JSONObject;Landroid/view/View;)V\n    .locals 3\n\n    invoke-virtual {p3}, Landroid/view/View;->getTag()Ljava/lang/Object;\n\n    move-result-object v0\n\n    const-string v1, "lenton_expand_full"\n\n    invoke-virtual {v1, v0}, Ljava/lang/String;->equals(Ljava/lang/Object;)Z\n\n    move-result v2\n'
          assert s.count(sig)==1
          s=s.replace(sig,sig2,1)
          start=s.index('.method synthetic lambda$expandInlineReplyBar$162$')
          end=s.index('.end method',start)+len('.end method')
          chunk=s[start:end]
          old='''    :cond_0\n    iget-object p1, p0, Lcom/mastoflow/app/MainActivity;->root:Landroid/widget/LinearLayout;\n'''
          new='''    :cond_0\n    if-nez v2, :cond_1\n\n    iget-object p1, p0, Lcom/mastoflow/app/MainActivity;->root:Landroid/widget/LinearLayout;\n'''
          assert chunk.count(old)==1
          chunk=chunk.replace(old,new,1)
          s=s[:start]+chunk+s[end:]

          s=s.replace('Lenton-Updater/0.22.01','Lenton-Updater/0.22.02')
          start=s.index('.method private currentReleaseNotes()Ljava/lang/String;')
          end=s.index('.end method',start)+len('.end method')
          notes='''.method private currentReleaseNotes()Ljava/lang/String;\n    .locals 1\n\n    const-string v0, "\\u2022 \\uc791\\uc740 \\ub2f5\\uae00\\ucc3d \\uc6b0\\uce21 \\uc0c1\\ub2e8\\uc5d0 \\uc804\\uccb4 \\uc791\\uc131\\ucc3d \\ud655\\ub300 \\ubc84\\ud2bc \\ucd94\\uac00\\n\\u2022 \\uc791\\uc740 \\ub2f5\\uae00\\ucc3d\\uc5d0\\uc11c \\uc791\\uc131 \\uc911\\uc774\\ub358 \\ub0b4\\uc6a9\\uc744 \\uadf8\\ub300\\ub85c \\uc804\\uccb4 \\ub2f5\\uae00 \\uc791\\uc131\\ucc3d\\uc73c\\ub85c \\uc804\\ub2ec\\n\\u2022 \\uae30\\uc874 \\ub2f5\\uae00 \\ub300\\uc0c1\\u00b7\\ud0a4\\ubcf4\\ub4dc\\u00b7\\uc5c5\\ub370\\uc774\\ud2b8\\u00b7\\uc54c\\ub9bc\\u00b7DM \\uae30\\ub2a5 \\uc720\\uc9c0"\n\n    return-object v0\n.end method'''
          s=s[:start]+notes+s[end:]
          smali.write_text(s)

          y=root/'apktool.yml'
          yy=y.read_text()
          assert 'versionCode: 122' in yy and 'versionName: 0.22.01' in yy
          yy=yy.replace('apkFileName: Lenton-v0.22.01-aligned-unsigned.apk','apkFileName: Lenton-v0.22.02.apk',1)
          yy=yy.replace('versionCode: 122','versionCode: 123',1).replace('versionName: 0.22.01','versionName: 0.22.02',1)
          y.write_text(yy)

          assert 'lenton_expand_full' in s
          assert '전체 답글 작성창으로 확대' in s
          assert 'Lenton-Updater/0.22.02' in s
          print('v0.22.02 expand-only smali patch applied')
          PY

      - name: Build and align unsigned APK
        shell: bash
        run: |
          java -jar apktool.jar b work -o Lenton-v0.22.02-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.1/zipalign" -f -p 4 Lenton-v0.22.02-unsigned.apk Lenton-v0.22.02-aligned-unsigned.apk
          sha256sum Lenton-v0.22.02-aligned-unsigned.apk > unsigned-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Lenton-v0.22.02-unsigned
          path: |
            Lenton-v0.22.02-aligned-unsigned.apk
            unsigned-sha256.txt
          if-no-files-found: error

      - name: Remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/build-unsigned-v02202-once.yml
          git commit -m 'Remove one-shot v0.22.02 unsigned build workflow'
          git push
