name: Deploy Lenton v0.22.07 updater package

on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/deploy-v02207-once.yml' ]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download exact signed v0.22.07 build artifact
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-3380-8211-a93e-878da73c466d/raw?se=2026-09-04T14%3A45%3A35Z&sp=r&sv=2026-02-06&sr=b&scid=52bef735-9f99-5eb8-992b-986e66aed7e7&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T03%3A01%3A58Z&ske=2026-09-05T03%3A01%3A58Z&sks=b&skv=2026-02-06&sig=RoTPdKEU8vfY2PWwsjXDhba8qwLgDdhmFQdK914iM6I%3D' -o artifact.zip
          rm -rf artifact
          mkdir artifact
          unzip -q artifact.zip -d artifact
          cp artifact/Lenton-v0.22.07.apk ./Lenton-v0.22.07.apk
          echo '2f94df1c47aec03d462bff614d4c660721f7e627ee89bd5bb5bb8bbe42bc0e24  Lenton-v0.22.07.apk' | sha256sum -c -

      - name: Verify Lenton signing certificate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct
          data=Path('Lenton-v0.22.07.apk').read_bytes()
          eocd=data.rfind(b'PK\x05\x06'); assert eocd>=0
          cd_offset=struct.unpack_from('<4sHHHHIIH',data,eocd)[6]
          size2=struct.unpack_from('<Q',data,cd_offset-24)[0]
          assert data[cd_offset-16:cd_offset]==b'APK Sig Block 42'
          block_start=cd_offset-(size2+8)
          pairs={}; i=block_start+8; end=cd_offset-24
          while i<end:
              length=struct.unpack_from('<Q',data,i)[0]; i+=8
              pair_id=struct.unpack_from('<I',data,i)[0]
              pairs[pair_id]=data[i+4:i+length]; i+=length
          def lp32(buf,off):
              length=struct.unpack_from('<I',buf,off)[0]; start=off+4; finish=start+length
              assert finish<=len(buf)
              return buf[start:finish],finish
          v2=pairs[0x7109871a]
          signers,_=lp32(v2,0); signer,_=lp32(signers,0); signed_data,_=lp32(signer,0)
          _,sd_off=lp32(signed_data,0); certs,_=lp32(signed_data,sd_off); cert,_=lp32(certs,0)
          cert_sha256=hashlib.sha256(cert).hexdigest()
          assert cert_sha256=='fe6fc92cc637bc3fdbd18e98b7c0846b8e489d4c0d0f4e859fc520333f2d8688', cert_sha256
          print('certificate OK:',cert_sha256)
          PY

      - name: Write updater metadata
        run: |
          python3 - <<'PY'
          import json
          info={
            'versionCode':128,
            'versionName':'0.22.07',
            'apkUrl':'https://raw.githubusercontent.com/cptu527/lenton-updates/main/Lenton-v0.22.07.apk',
            'sha256':'2f94df1c47aec03d462bff614d4c660721f7e627ee89bd5bb5bb8bbe42bc0e24',
            'notes':'다크/라이트 테마 변경 후 홈·타임라인·프로필 등 메인 화면 전체가 새 테마로 다시 표시되도록 수정 · 이전 테마로 만들어진 화면 스냅샷 재사용 방지 · 기존 계정 설정 스위치/업데이트 파란 점/프로필 페이지네이션/답글 확대/키보드/업데이트 기능 유지'
          }
          with open('latest.json','w',encoding='utf-8') as f:
              json.dump(info,f,ensure_ascii=False,indent=2)
              f.write('\n')
          PY
          cat latest.json

      - name: Publish updater package and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/deploy-v02207-once.yml
          git add Lenton-v0.22.07.apk latest.json .github/workflows/deploy-v02207-once.yml
          git commit -m 'Publish Lenton v0.22.07 update'
          git push origin main
