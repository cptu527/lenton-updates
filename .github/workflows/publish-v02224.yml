name: Publish Lenton v0.22.24

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v02224.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified build artifact
        run: |
          curl --fail --location --retry 3 \
            'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-e564-8211-8c76-cfa7dbffab09/raw?se=2026-09-05T06%3A49%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=055cdafc-0e79-5e5f-b765-008546bf2d0a&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-05T01%3A32%3A56Z&ske=2026-09-06T01%3A32%3A56Z&sks=b&skv=2026-02-06&sig=bSTyrp5kfPTPLZdRw1wspHqqqSfkEuU10OB3cncUE0w%3D' \
            --output /tmp/lenton-v02224.zip
          rm -rf /tmp/lenton-v02224
          mkdir -p /tmp/lenton-v02224
          unzip -o /tmp/lenton-v02224.zip -d /tmp/lenton-v02224
          test -f /tmp/lenton-v02224/Lenton-v0.22.24.apk
          cp /tmp/lenton-v02224/Lenton-v0.22.24.apk ./Lenton-v0.22.24.apk

      - name: Verify APK hash and publish metadata
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json
          apk=Path('Lenton-v0.22.24.apk')
          digest=hashlib.sha256(apk.read_bytes()).hexdigest()
          expected='9a3ce4a06b2b0328828f28ae30d066ca70efd2c747070940652b644ca08191b2'
          assert digest==expected,(digest,expected)
          meta={
              'versionCode':145,
              'versionName':'0.22.24',
              'apkUrl':'https://raw.githubusercontent.com/cptu527/lenton-updates/main/Lenton-v0.22.24.apk',
              'sha256':digest,
              'notes':'검정 테마에서 @멘션 태그를 살짝 두껍게 표시해 가독성 개선 · 라이트 테마와 일반 링크 굵기는 그대로 유지 · v0.22.23 서버 도메인 표시 및 기존 기능 유지'
          }
          Path('latest.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('published sha256:',digest)

      - name: Commit app update files
        run: |
          git config user.name 'lenton-update-bot'
          git config user.email 'lenton-update-bot@users.noreply.github.com'
          git add Lenton-v0.22.24.apk latest.json
          if git diff --cached --quiet; then
            echo 'Update files already published.'
            exit 0
          fi
          git commit -m 'Publish Lenton v0.22.24 update'
          git push
