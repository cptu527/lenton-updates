name: Build and verify Lenton v0.22.03 hotfix

on:
  push:
    branches: [ deploy-v02203-final ]
    paths:
      - '.github/workflows/deploy-v02203-final.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zstd
        run: sudo apt-get update -qq && sudo apt-get install -y zstd

      - name: Prepare exact v0.22.03 unsigned APK
        run: |
          curl -fL --retry 3 'https://raw.githubusercontent.com/cptu527/lenton-updates/main/Lenton-v0.22.02.apk' -o Lenton-v0.22.02-release.apk
          echo '3ca5341ccb5b47dadf207d4e2c94811f555df0ced1027d49d97a91fa2678e9c9  Lenton-v0.22.02-release.apk' | sha256sum -c -
          curl -fL --retry 3 'https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar' -o apktool.jar
          java -jar apktool.jar d -f Lenton-v0.22.02-release.apk -o work
          python3 - <<'PY'
          from pathlib import Path
          sm=Path('work/smali/com/mastoflow/app/MainActivity.smali')
          s=sm.read_text()
          old='''    move-object/from16 v11, v16\n\n    invoke-virtual {v11, v3}, Landroid/widget/TextView;->setOnClickListener(Landroid/view/View$OnClickListener;)V\n\n    .line 1130\n    new-instance v3, Landroid/widget/LinearLayout$LayoutParams;\n\n    invoke-direct {v3, v13, v11}, Landroid/widget/LinearLayout$LayoutParams;-><init>(II)V\n'''
          new='''    move-object/from16 v11, v16\n\n    invoke-virtual {v11, v3}, Landroid/widget/TextView;->setOnClickListener(Landroid/view/View$OnClickListener;)V\n\n    .line 1130\n    new-instance v3, Landroid/widget/LinearLayout$LayoutParams;\n\n    const/4 v11, -0x2\n\n    invoke-direct {v3, v13, v11}, Landroid/widget/LinearLayout$LayoutParams;-><init>(II)V\n'''
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          s=s.replace('Lenton-Updater/0.22.02','Lenton-Updater/0.22.03')
          start=s.index('.method private currentReleaseNotes()Ljava/lang/String;')
          end=s.index('.end method',start)+len('.end method')
          notes='''.method private currentReleaseNotes()Ljava/lang/String;\n    .locals 1\n\n    const-string v0, "\\u2022 v0.22.02 \\uc2e4\\ud589 \\uc989\\uc2dc \\uc885\\ub8cc \\ubb38\\uc81c \\uc218\\uc815\\n\\u2022 \\uc791\\uc740 \\ub2f5\\uae00\\ucc3d \\ud655\\ub300 \\ubc84\\ud2bc \\ubc0f \\uc791\\uc131 \\uc911 \\ub0b4\\uc6a9 \\uc804\\ub2ec \\uae30\\ub2a5 \\uc720\\uc9c0\\n\\u2022 \\uae30\\uc874 UI\\u00b7\\ud0a4\\ubcf4\\ub4dc\\u00b7\\uc5c5\\ub370\\uc774\\ud2b8\\u00b7\\uc54c\\ub9bc\\u00b7DM \\uae30\\ub2a5 \\ubcc0\\uacbd \\uc5c6\\uc74c"\n\n    return-object v0\n.end method'''
          s=s[:start]+notes+s[end:]
          sm.write_text(s)
          y=Path('work/apktool.yml')
          t=y.read_text()
          assert 'versionCode: 123' in t and 'versionName: 0.22.02' in t
          t=t.replace('apkFileName: Lenton-v0.22.02-release.apk','apkFileName: Lenton-v0.22.03.apk',1)
          t=t.replace('versionCode: 123','versionCode: 124',1).replace('versionName: 0.22.02','versionName: 0.22.03',1)
          y.write_text(t)
          ss=sm.read_text()
          needle='invoke-virtual {v11, v3}, Landroid/widget/TextView;->setOnClickListener(Landroid/view/View$OnClickListener;)V\n\n    .line 1130\n    new-instance v3, Landroid/widget/LinearLayout$LayoutParams;\n\n    const/4 v11, -0x2\n\n    invoke-direct {v3, v13, v11}'
          assert needle in ss and 'lenton_expand_full' in ss and 'MainActivity$$ExternalSyntheticLambda28' in ss
          PY
          java -jar apktool.jar b work -o Lenton-v0.22.03-unsigned.apk
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,struct
          src=Path('Lenton-v0.22.03-unsigned.apk'); dst=Path('Lenton-v0.22.03-aligned.apk')
          with zipfile.ZipFile(src,'r') as zin, zipfile.ZipFile(dst,'w',allowZip64=True) as zout:
              for old in zin.infolist():
                  data=zin.read(old.filename)
                  zi=zipfile.ZipInfo(old.filename,old.date_time); zi.compress_type=old.compress_type; zi.comment=old.comment; zi.internal_attr=old.internal_attr; zi.external_attr=old.external_attr; zi.create_system=old.create_system; zi.create_version=old.create_version; zi.extract_version=old.extract_version; zi.flag_bits=old.flag_bits; zi.volume=old.volume
                  base_extra=old.extra or b''; zi.extra=base_extra
                  if old.compress_type==zipfile.ZIP_STORED:
                      pos=zout.fp.tell(); name_bytes=old.filename.encode('utf-8'); base_off=pos+30+len(name_bytes)+len(base_extra); need=(-base_off)%4
                      if need: zi.extra=base_extra+struct.pack('<HH',0xffff,need)+(b'\0'*need)
                  zout.writestr(zi,data,compress_type=old.compress_type,compresslevel=9 if old.compress_type==zipfile.ZIP_DEFLATED else None)
          raw=dst.read_bytes(); bad=[]
          with zipfile.ZipFile(dst,'r') as z:
              for info in z.infolist():
                  if info.compress_type==zipfile.ZIP_STORED:
                      off=info.header_offset; n,e=struct.unpack_from('<HH',raw,off+26); data_off=off+30+n+e
                      if data_off%4: bad.append((info.filename,data_off%4))
          assert not bad,bad[:10]
          PY
          echo '2e0152710bd7f05178f30153a173c493059dabca35f8c4d3b2cd6c26e9bac766  Lenton-v0.22.03-aligned.apk' | sha256sum -c -

      - name: Restore exact signed APK and verify hash
        run: |
          cat .deploy/v02203.part0 .deploy/v02203.part1 .deploy/v02203.part2 > v02203-signature.patch.zst
          echo '2847bb10ab7110f5a3245c06c1a2922f9c39b22376f0f4a9411fd0694e588225  v02203-signature.patch.zst' | sha256sum -c -
          zstd -q -d --patch-from=Lenton-v0.22.03-aligned.apk v02203-signature.patch.zst -o Lenton-v0.22.03.apk
          echo '85e8f2bb06e06f3e016c66f6d6c22507387bf40448079fc5dd8db530e5dc9749  Lenton-v0.22.03.apk' | sha256sum -c -

      - name: Publish verified hotfix on this branch
        run: |
          cat > latest.json <<'JSON'
          {
            "versionCode": 124,
            "versionName": "0.22.03",
            "apkUrl": "https://raw.githubusercontent.com/cptu527/lenton-updates/main/Lenton-v0.22.03.apk",
            "sha256": "85e8f2bb06e06f3e016c66f6d6c22507387bf40448079fc5dd8db530e5dc9749",
            "notes": "v0.22.02 실행 즉시 종료 문제 수정 · 작은 답글창 확대 버튼과 작성 중 내용 전달 기능 유지 · 기존 UI/키보드/업데이트/알림/DM 기능 변경 없음"
          }
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Lenton-v0.22.03.apk latest.json
          git rm .deploy/v02203.part0 .deploy/v02203.part1 .deploy/v02203.part2 .github/workflows/deploy-v02203-final.yml
          git commit -m 'Deploy Lenton v0.22.03 startup hotfix'
          git push
