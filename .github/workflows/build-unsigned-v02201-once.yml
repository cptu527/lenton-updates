name: Prepare unsigned Lenton v0.22.01

on:
  push:
    paths:
      - '.github/workflows/build-unsigned-v02201-once.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'build-tools;35.0.1'

      - name: Download apktool
        shell: bash
        run: |
          curl -fL --retry 3 'https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar' -o apktool.jar

      - name: Decode v0.22.00 and apply only v0.22.01 IME correction
        shell: bash
        run: |
          java -jar apktool.jar d -f Lenton-v0.22.00.apk -o work
          python3 - <<'PY'
          from pathlib import Path
          import re

          root=Path('work')
          y=root/'apktool.yml'
          s=y.read_text()
          assert 'versionCode: 121' in s and 'versionName: 0.22.00' in s
          s=s.replace('apkFileName: Lenton-v0.22.00.apk','apkFileName: Lenton-v0.22.01.apk',1)
          s=s.replace('versionCode: 121','versionCode: 122',1).replace('versionName: 0.22.00','versionName: 0.22.01',1)
          y.write_text(s)

          main=root/'smali/com/mastoflow/app/MainActivity.smali'
          s=main.read_text()
          anchor='''    invoke-virtual {v2, v0, v1}, Landroid/widget/LinearLayout;->addView(Landroid/view/View;Landroid/view/ViewGroup$LayoutParams;)V\n\n    invoke-direct {p0, v0, p1}, Lcom/mastoflow/app/MainActivity;->renderInlineReplyCompact(Landroid/widget/LinearLayout;Lorg/json/JSONObject;)V'''
          replacement='''    invoke-virtual {v2, v0, v1}, Landroid/widget/LinearLayout;->addView(Landroid/view/View;Landroid/view/ViewGroup$LayoutParams;)V\n\n    sget v2, Landroid/os/Build$VERSION;->SDK_INT:I\n\n    const/16 v3, 0x1e\n\n    if-lt v2, v3, :cond_3\n\n    new-instance v2, Lcom/mastoflow/app/LentonReplyImeInsetsListener;\n\n    invoke-direct {v2, p0, v5}, Lcom/mastoflow/app/LentonReplyImeInsetsListener;-><init>(Lcom/mastoflow/app/MainActivity;I)V\n\n    invoke-virtual {v0, v2}, Landroid/widget/LinearLayout;->setOnApplyWindowInsetsListener(Landroid/view/View$OnApplyWindowInsetsListener;)V\n\n    invoke-virtual {v0}, Landroid/widget/LinearLayout;->requestApplyInsets()V\n\n    :cond_3\n    invoke-direct {p0, v0, p1}, Lcom/mastoflow/app/MainActivity;->renderInlineReplyCompact(Landroid/widget/LinearLayout;Lorg/json/JSONObject;)V'''
          assert anchor in s
          s=s.replace(anchor,replacement,1)
          s=s.replace('Lenton-Updater/0.22.00','Lenton-Updater/0.22.01')

          start=s.find('.method private currentReleaseNotes()Ljava/lang/String;')
          assert start>=0
          end=s.find('.end method',start)
          assert end>start
          chunk=s[start:end]
          chunk2=re.sub(r'const-string v0, ".*?"', 'const-string v0, "\\u2022 \\uc0bc\\uc131/Android 15\\uc5d0\\uc11c \\ub2f5\\uae00\\ucc3d\\uc774 \\ud0a4\\ubcf4\\ub4dc \\ub4a4\\uc5d0 \\uac00\\ub824\\uc9c0\\ub358 \\ubb38\\uc81c \\uc7ac\\uc218\\uc815\\n\\u2022 \\uc2e4\\uc81c IME \\uacb9\\uce68 \\ub192\\uc774\\ub9cc\\ud07c \\ub2f5\\uae00 \\ud328\\ub110\\uc744 \\ud0a4\\ubcf4\\ub4dc \\ubc14\\ub85c \\uc704\\ub85c \\uc774\\ub3d9\\n\\u2022 \\ud0a4\\ubcf4\\ub4dc\\uac00 \\ub0b4\\ub824\\uac00\\uba74 \\ub2f5\\uae00 \\ud328\\ub110\\ub3c4 \\uc6d0\\ub798 \\uc704\\uce58\\ub85c \\uc790\\ub3d9 \\ubcf5\\uadc0\\n\\u2022 v0.22.00 \\uc5c5\\ub370\\uc774\\ud2b8 \\uce90\\uc2dc \\uc218\\uc815 \\ubc0f \\uae30\\uc874 \\uae30\\ub2a5 \\uc720\\uc9c0"', chunk, count=1)
          assert chunk2!=chunk
          s=s[:start]+chunk2+s[end:]
          main.write_text(s)

          listener=root/'smali/com/mastoflow/app/LentonReplyImeInsetsListener.smali'
          listener.write_text(r'''.class final Lcom/mastoflow/app/LentonReplyImeInsetsListener;
.super Ljava/lang/Object;
.source "LentonReplyImeInsetsListener.java"

# interfaces
.implements Landroid/view/View$OnApplyWindowInsetsListener;

# instance fields
.field private final activity:Lcom/mastoflow/app/MainActivity;
.field private final baseBottom:I

# direct methods
.method constructor <init>(Lcom/mastoflow/app/MainActivity;I)V
    .locals 0
    invoke-direct {p0}, Ljava/lang/Object;-><init>()V
    iput-object p1, p0, Lcom/mastoflow/app/LentonReplyImeInsetsListener;->activity:Lcom/mastoflow/app/MainActivity;
    iput p2, p0, Lcom/mastoflow/app/LentonReplyImeInsetsListener;->baseBottom:I
    return-void
.end method

# virtual methods
.method public onApplyWindowInsets(Landroid/view/View;Landroid/view/WindowInsets;)Landroid/view/WindowInsets;
    .locals 12
    invoke-virtual {p1}, Landroid/view/View;->getLayoutParams()Landroid/view/ViewGroup$LayoutParams;
    move-result-object v0
    instance-of v1, v0, Landroid/widget/LinearLayout$LayoutParams;
    if-eqz v1, :cond_2
    check-cast v0, Landroid/widget/LinearLayout$LayoutParams;
    iget v1, v0, Landroid/widget/LinearLayout$LayoutParams;->bottomMargin:I
    iget v2, p0, Lcom/mastoflow/app/LentonReplyImeInsetsListener;->baseBottom:I
    sub-int v3, v1, v2
    const/4 v4, 0x0
    invoke-static {v3, v4}, Ljava/lang/Math;->max(II)I
    move-result v3
    move v5, v4
    invoke-static {}, Landroid/view/WindowInsets$Type;->ime()I
    move-result v6
    invoke-virtual {p2, v6}, Landroid/view/WindowInsets;->isVisible(I)Z
    move-result v6
    if-eqz v6, :cond_0
    invoke-static {}, Landroid/view/WindowInsets$Type;->ime()I
    move-result v6
    invoke-virtual {p2, v6}, Landroid/view/WindowInsets;->getInsets(I)Landroid/graphics/Insets;
    move-result-object v7
    iget-object v9, p0, Lcom/mastoflow/app/LentonReplyImeInsetsListener;->activity:Lcom/mastoflow/app/MainActivity;
    invoke-virtual {v9}, Lcom/mastoflow/app/MainActivity;->getWindowManager()Landroid/view/WindowManager;
    move-result-object v9
    invoke-interface {v9}, Landroid/view/WindowManager;->getCurrentWindowMetrics()Landroid/view/WindowMetrics;
    move-result-object v9
    invoke-virtual {v9}, Landroid/view/WindowMetrics;->getBounds()Landroid/graphics/Rect;
    move-result-object v9
    invoke-virtual {v9}, Landroid/graphics/Rect;->height()I
    move-result v8
    const/4 v11, 0x2
    new-array v10, v11, [I
    invoke-virtual {p1, v10}, Landroid/view/View;->getLocationInWindow([I)V
    const/4 v11, 0x1
    aget v10, v10, v11
    invoke-virtual {p1}, Landroid/view/View;->getHeight()I
    move-result v11
    add-int/2addr v10, v11
    add-int/2addr v10, v3
    iget v11, v7, Landroid/graphics/Insets;->bottom:I
    sub-int/2addr v8, v11
    sub-int/2addr v10, v8
    invoke-static {v4, v10}, Ljava/lang/Math;->max(II)I
    move-result v5
    :cond_0
    iget v2, p0, Lcom/mastoflow/app/LentonReplyImeInsetsListener;->baseBottom:I
    add-int/2addr v2, v5
    iget v1, v0, Landroid/widget/LinearLayout$LayoutParams;->bottomMargin:I
    if-eq v1, v2, :cond_1
    iput v2, v0, Landroid/widget/LinearLayout$LayoutParams;->bottomMargin:I
    invoke-virtual {p1, v0}, Landroid/view/View;->setLayoutParams(Landroid/view/ViewGroup$LayoutParams;)V
    :cond_1
    if-lez v5, :cond_2
    invoke-virtual {p1}, Landroid/view/View;->bringToFront()V
    :cond_2
    return-object p2
.end method
''')
          PY

      - name: Build and align unsigned APK
        shell: bash
        run: |
          java -jar apktool.jar b work -o Lenton-v0.22.01-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.1/zipalign" -f -p 4 Lenton-v0.22.01-unsigned.apk Lenton-v0.22.01-aligned-unsigned.apk
          sha256sum Lenton-v0.22.01-aligned-unsigned.apk > unsigned-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Lenton-v0.22.01-unsigned
          path: |
            Lenton-v0.22.01-aligned-unsigned.apk
            unsigned-sha256.txt
          if-no-files-found: error

      - name: Remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/build-unsigned-v02201-once.yml
          git commit -m 'Remove one-shot v0.22.01 unsigned build workflow'
          git push
