name: Publish Lenton v0.23.04

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v02304.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact verified v0.23.04 artifact
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-8758-8211-a5e2-fc6b199f6cd2/raw?se=2026-09-06T14%3A11%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=970e0daf-8043-53f6-bb46-e1bb231ccf15&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-05T22%3A55%3A07Z&ske=2026-09-06T22%3A55%3A07Z&sks=b&skv=2026-02-06&sig=2aodD56a%2Bw9chQtn3T8GWO%2BHg7eY4KjuqtMJc0MYYPU%3D' -o artifact.zip
          unzip -o artifact.zip
          test -f Lenton-v0.23.04.apk
          actual="$(sha256sum Lenton-v0.23.04.apk | awk '{print $1}')"
          expected='51fe15ad678a4b701afd27aab0c337a8478dcb26ab87aefde5a1cc1a68cea50c'
          echo "APK_SHA256=$actual"
          test "$actual" = "$expected"

      - name: Write UTF-8 update metadata
        run: |
          python3 - <<'PY'
          import json
          data = {
            "versionCode": 168,
            "versionName": "0.23.04",
            "apkUrl": "https://raw.githubusercontent.com/cptu527/lenton-updates/main/Lenton-v0.23.04.apk",
            "sha256": "51fe15ad678a4b701afd27aab0c337a8478dcb26ab87aefde5a1cc1a68cea50c",
            "notes": "DM이 공개/미등록 공개 타래에서 이어진 경우 이전 공개 대화 보기 판별 개선 · 중간에 여러 DM 답글이 있어도 조상 타래를 확인해 공개 시작점을 찾음 · DM 최적화/남은 글자 수 및 기존 기능 유지"
          }
          with open('latest.json','w',encoding='utf-8') as f:
            json.dump(data,f,ensure_ascii=False,indent=2)
            f.write('\n')
          PY
          cat latest.json

      - name: Publish APK and latest.json
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Lenton-v0.23.04.apk latest.json
          git rm .github/workflows/publish-v02304.yml
          git commit -m 'Publish Lenton v0.23.04 public DM ancestor link fix'
          git push origin HEAD:main
