name: Deploy Lenton v0.22.11 CW Display

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/deploy-v02211-cw-display.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download verified build artifact
        env:
          ARTIFACT_URL: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-e0ec-8211-9548-5b43fc1f676e/raw?se=2026-09-05T00%3A49%3A40Z&sp=r&sv=2026-02-06&sr=b&scid=c5842949-14c4-55fa-ab4c-7e1480002727&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T23%3A11%3A13Z&ske=2026-09-05T23%3A11%3A13Z&sks=b&skv=2026-02-06&sig=iQjoGlad13ThhJ3iQLuAPBQOBhB82T1RZYP3xUuz6zg%3D'
        run: |
          set -euo pipefail
          curl -fL --retry 3 "$ARTIFACT_URL" -o artifact.zip
          rm -rf artifact-unpack
          mkdir artifact-unpack
          unzip -q artifact.zip -d artifact-unpack
          test -f artifact-unpack/Lenton-v0.22.11.apk
          echo 'fbcfca304ad109292f12e6c8f0bad577ed055d004a1e1f1a7d7779bc703256ff  artifact-unpack/Lenton-v0.22.11.apk' | sha256sum -c -
          cp artifact-unpack/Lenton-v0.22.11.apk ./Lenton-v0.22.11.apk

      - name: Write updater metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          meta = {
              "versionCode": 132,
              "versionName": "0.22.11",
              "apkUrl": "https://raw.githubusercontent.com/cptu527/lenton-updates/main/Lenton-v0.22.11.apk",
              "sha256": "fbcfca304ad109292f12e6c8f0bad577ed055d004a1e1f1a7d7779bc703256ff",
              "notes": "CW 게시물은 경고 문구만 먼저 표시하고 본문을 숨김 · 영상처럼 테두리 있는 더보기 버튼으로 펼치기 · 펼친 뒤 숨기기로 다시 접기 · v0.22.10 기존 기능 유지"
          }
          Path("latest.json").write_text(json.dumps(meta, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          cat latest.json

      - name: Commit updater release
        run: |
          set -euo pipefail
          git config user.name 'Lenton Build'
          git config user.email 'actions@users.noreply.github.com'
          git add Lenton-v0.22.11.apk latest.json
          if git diff --cached --quiet; then
            echo 'Updater files already current'
            exit 0
          fi
          git commit -m 'Deploy Lenton v0.22.11'
          git push origin HEAD:main
