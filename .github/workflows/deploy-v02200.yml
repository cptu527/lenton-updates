name: Deploy Lenton v0.22.00 updater package

on:
  push:
    paths:
      - '.github/workflows/deploy-v02200.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download v0.22.00 build artifact
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-aa3c-8211-98bb-9cd635066dd0/raw?se=2026-09-04T08%3A21%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=531f2270-b8ac-571e-89fd-834e6386a1ac&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T03%3A15%3A37Z&ske=2026-09-05T03%3A15%3A37Z&sks=b&skv=2026-02-06&sig=2oN2yIvOp93O7aupfExnPhY2y4sPftwPFKfPgIgcF8s%3D' \
            -o Lenton-v0.22.00-apk.zip
          echo '0ed389095eabf634638184bbc1ca64f4b3e0d39956451bde59b2733fb8b8872d  Lenton-v0.22.00-apk.zip' | sha256sum -c -
          unzip -o Lenton-v0.22.00-apk.zip Lenton-v0.22.00.apk

      - name: Verify APK SHA-256
        run: |
          echo 'c581991faa5780cb20ea9cb415e7db769e104e95ac68921bd9e12c47ebcf8593  Lenton-v0.22.00.apk' | sha256sum -c -

      - name: Write latest updater manifest
        run: |
          cat > latest.json <<'JSON'
          {
            "versionCode": 121,
            "versionName": "0.22.00",
            "apkUrl": "https://raw.githubusercontent.com/cptu527/lenton-updates/main/Lenton-v0.22.00.apk",
            "sha256": "c581991faa5780cb20ea9cb415e7db769e104e95ac68921bd9e12c47ebcf8593",
            "notes": "답글 입력창이 키보드에 가려지는 문제 수정 · 키보드가 올라오면 답글 패널도 바로 위로 함께 이동 · 업데이트 정보 캐시 문제 수정 · 새 알림 파란색 표시 유지"
          }
          JSON

      - name: Commit updater package and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f Lenton-v0.22.00-apk.zip
          git rm .github/workflows/deploy-v02200.yml
          git add Lenton-v0.22.00.apk latest.json
          git commit -m 'Publish Lenton v0.22.00 updater package'
          git push
