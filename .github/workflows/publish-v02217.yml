name: Publish Lenton v0.22.17

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v02217.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified build artifact
        run: |
          curl --fail --location --retry 3 \
            'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-5918-8211-a53c-a1c15e8a11aa/raw?se=2026-09-05T04%3A19%3A02Z&sp=r&sv=2026-02-06&sr=b&scid=7bf71737-fd2c-5566-90b2-aaa9f43cf58d&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T23%3A17%3A54Z&ske=2026-09-05T23%3A17%3A54Z&sks=b&skv=2026-02-06&sig=tV3h5l74HN2Xr17er6WOnh0DnH3vaaVFaUCrpqRJB6E%3D' \
            --output /tmp/lenton-v02217.zip
          mkdir -p /tmp/lenton-v02217
          unzip -o /tmp/lenton-v02217.zip -d /tmp/lenton-v02217
          test -f /tmp/lenton-v02217/Lenton-v0.22.17.apk
          cp /tmp/lenton-v02217/Lenton-v0.22.17.apk ./Lenton-v0.22.17.apk

      - name: Verify APK hash and publish metadata
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json
          apk = Path('Lenton-v0.22.17.apk')
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          expected = '2db4c604672b7154b3a9e6df70023896cde676af17ff522de45a995a8807b6de'
          assert digest == expected, (digest, expected)
          meta = {
              'versionCode': 138,
              'versionName': '0.22.17',
              'apkUrl': 'https://raw.githubusercontent.com/cptu527/lenton-updates/main/Lenton-v0.22.17.apk',
              'sha256': digest,
              'notes': '퍼블릭 타임라인 요청 실패를 빈 타임라인으로 저장하지 않도록 수정 · 팔로잉 목록 요청 실패도 빈 캐시로 확정하지 않음 · 기존 정상 퍼블릭 캐시와 v0.22.16 기능 유지'
          }
          Path('latest.json').write_text(json.dumps(meta, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('published sha256:', digest)

      - name: Commit app update files
        run: |
          git config user.name 'lenton-update-bot'
          git config user.email 'lenton-update-bot@users.noreply.github.com'
          git add Lenton-v0.22.17.apk latest.json
          if git diff --cached --quiet; then
            echo 'Update files already published.'
            exit 0
          fi
          git commit -m 'Publish Lenton v0.22.17 update'
          git push
