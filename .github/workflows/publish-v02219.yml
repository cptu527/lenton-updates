name: Publish Lenton v0.22.19

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v02219.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified build artifact
        run: |
          curl --fail --location --retry 3 \
            'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-b0ec-8211-aa85-c35e1aa977de/raw?se=2026-09-05T04%3A57%3A06Z&sp=r&sv=2026-02-06&sr=b&scid=c1c3dd4d-c780-5891-8b52-a2eef78feb82&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-05T00%3A46%3A45Z&ske=2026-09-06T00%3A46%3A45Z&sks=b&skv=2026-02-06&sig=lAiTkgGt3tg3HpFUVnY61SEQUq%2BzER6VuvIrrykAVU8%3D' \
            --output /tmp/lenton-v02219.zip
          mkdir -p /tmp/lenton-v02219
          unzip -o /tmp/lenton-v02219.zip -d /tmp/lenton-v02219
          test -f /tmp/lenton-v02219/Lenton-v0.22.19.apk
          cp /tmp/lenton-v02219/Lenton-v0.22.19.apk ./Lenton-v0.22.19.apk

      - name: Verify APK hash and publish metadata
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json
          apk = Path('Lenton-v0.22.19.apk')
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          expected = '6c1028d55d1cfef84273c052cef5b3b69c8fed224e4846e4b33343505ffce208'
          assert digest == expected, (digest, expected)
          meta = {
              'versionCode': 140,
              'versionName': '0.22.19',
              'apkUrl': 'https://raw.githubusercontent.com/cptu527/lenton-updates/main/Lenton-v0.22.19.apk',
              'sha256': digest,
              'notes': '퍼블릭을 인증된 홈 타임라인 중심으로 구성해 빈 결과 문제를 줄임 · 시간순 캐시에서 퍼블릭을 즉시 만들어 먼저 표시해 로딩 체감 개선 · 초기 퍼블릭 깊은 탐색에서 글로벌 퍼블릭 반복 요청을 제거해 요청 수와 대기시간 감소 · 기존 기능 유지'
          }
          Path('latest.json').write_text(json.dumps(meta, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('published sha256:', digest)

      - name: Commit app update files
        run: |
          git config user.name 'lenton-update-bot'
          git config user.email 'lenton-update-bot@users.noreply.github.com'
          git add Lenton-v0.22.19.apk latest.json
          if git diff --cached --quiet; then
            echo 'Update files already published.'
            exit 0
          fi
          git commit -m 'Publish Lenton v0.22.19 update'
          git push
