name: Publish Lenton v0.22.34

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v02234.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v0.22.34 build artifact
        env:
          ARTIFACT_URL_B64: 
        run: |
          ARTIFACT_URL="$(printf '%s' "$ARTIFACT_URL_B64" | base64 -d)"
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output /tmp/lenton-v02234.zip
          rm -rf /tmp/lenton-v02234
          mkdir -p /tmp/lenton-v02234
          unzip -o /tmp/lenton-v02234.zip -d /tmp/lenton-v02234
          test -f /tmp/lenton-v02234/Lenton-v0.22.34.apk
          cp /tmp/lenton-v02234/Lenton-v0.22.34.apk ./Lenton-v0.22.34.apk

      - name: Verify APK and write updater metadata
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json
          apk = Path('Lenton-v0.22.34.apk')
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          expected = '7ba62d3d188c29d5f390b2882694ff3b28819630fd3aefae41536ad13db05f67'
          assert digest == expected, (digest, expected)
          meta = {
              'versionCode': 155,
              'versionName': '0.22.34',
              'apkUrl': 'https://raw.githubusercontent.com/cptu527/lenton-updates/main/Lenton-v0.22.34.apk',
              'sha256': digest,
              'notes': '새로 도착한 알림을 현재 강조 색상으로 아주 옅게 배경 표시 · 알림 새로고침/다시 불러오기 시 임시 강조 배경을 해제하고 기본 배경으로 복귀 · 알림 읽음·배지·계정별 상태는 기존 로직 유지 · v0.22.33 이하 기존 기능 유지'
          }
          Path('latest.json').write_text(json.dumps(meta, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('verified apk sha256:', digest)

      - name: Publish update and remove temporary workflow
        run: |
          git config user.name 'lenton-update-bot'
          git config user.email 'lenton-update-bot@users.noreply.github.com'
          git add Lenton-v0.22.34.apk latest.json
          git rm .github/workflows/publish-v02234.yml
          git commit -m 'Publish Lenton v0.22.34 update'
          git push
