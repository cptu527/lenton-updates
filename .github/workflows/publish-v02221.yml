name: Publish Lenton v0.22.21

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v02221.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified build artifact
        run: |
          curl --fail --location --retry 3 \
            'https://sdmntprcentralindia.oaiusercontent.com/files/00000000-4830-8208-90ec-68943a39659a/raw?se=2026-09-05T05%3A47%3A24Z&sp=r&sv=2026-02-06&sr=b&scid=9d4fba5f-711a-58b1-9a35-66e9afca5b29&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-05T00%3A46%3A39Z&ske=2026-09-06T00%3A46%3A39Z&sks=b&skv=2026-02-06&sig=txXjDHOc1HAZQJ2gQ2k4nAOOti23fOT4tzP58WMKE/A%3D' \
            --output /tmp/lenton-v02221.zip
          rm -rf /tmp/lenton-v02221
          mkdir -p /tmp/lenton-v02221
          unzip -o /tmp/lenton-v02221.zip -d /tmp/lenton-v02221
          test -f /tmp/lenton-v02221/Lenton-v0.22.21.apk
          cp /tmp/lenton-v02221/Lenton-v0.22.21.apk ./Lenton-v0.22.21.apk

      - name: Verify APK hash and publish metadata
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json
          apk=Path('Lenton-v0.22.21.apk')
          digest=hashlib.sha256(apk.read_bytes()).hexdigest()
          expected='07ae5f3badee9ba54acd0349c47e56d80f27fc16aed9c1e95ce7669a6f11ef83'
          assert digest==expected,(digest,expected)
          meta={
              'versionCode':142,
              'versionName':'0.22.21',
              'apkUrl':'https://raw.githubusercontent.com/cptu527/lenton-updates/main/Lenton-v0.22.21.apk',
              'sha256':digest,
              'notes':'답글 작성에서 +로 여러 게시물을 이어 쓸 때 첫 답글의 상대/멘션 대상을 모든 후속 게시물에 그대로 유지 · 내 계정은 기존 replyPrefix 규칙대로 제외 · 후속 글은 직전 글에 답글로 이어지는 기존 타래 구조 유지 · v0.22.20 성능 최적화와 기존 기능 유지'
          }
          Path('latest.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('published sha256:',digest)

      - name: Commit app update files
        run: |
          git config user.name 'lenton-update-bot'
          git config user.email 'lenton-update-bot@users.noreply.github.com'
          git add Lenton-v0.22.21.apk latest.json
          if git diff --cached --quiet; then
            echo 'Update files already published.'
            exit 0
          fi
          git commit -m 'Publish Lenton v0.22.21 update'
          git push
