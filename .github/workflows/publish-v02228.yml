name: Publish Lenton v0.22.28

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v02228.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified build artifact
        run: |
          curl --fail --location --retry 3 \
            'https://sdmntprcentralindia.oaiusercontent.com/files/00000000-b90c-8208-a55a-ea04eb988e9f/raw?se=2026-09-05T07%3A35%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=e6c2e6d9-7fc3-5215-94f6-02d6782d5cf8&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T23%3A13%3A42Z&ske=2026-09-05T23%3A13%3A42Z&sks=b&skv=2026-02-06&sig=s4qEYvjDSlEjvRz03%2Bh2/W5FKAvHpvDgVw5Fvl6F7pY%3D' \
            --output /tmp/lenton-v02228.zip
          rm -rf /tmp/lenton-v02228
          mkdir -p /tmp/lenton-v02228
          unzip -o /tmp/lenton-v02228.zip -d /tmp/lenton-v02228
          test -f /tmp/lenton-v02228/Lenton-v0.22.28.apk
          cp /tmp/lenton-v02228/Lenton-v0.22.28.apk ./Lenton-v0.22.28.apk

      - name: Verify APK hash and publish metadata
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json
          apk=Path('Lenton-v0.22.28.apk')
          digest=hashlib.sha256(apk.read_bytes()).hexdigest()
          expected='de994cdb07a5a8e26c29fdd510666fad7fd18d4c3adba5e901c817f82cdf83aa'
          assert digest==expected,(digest,expected)
          meta={
              'versionCode':149,
              'versionName':'0.22.28',
              'apkUrl':'https://raw.githubusercontent.com/cptu527/lenton-updates/main/Lenton-v0.22.28.apk',
              'sha256':digest,
              'notes':'타래의 각 게시물마다 CW를 따로 켜고 경고 문구를 지정 가능 · CW 더보기/숨기기 버튼의 터치 제스처를 게시물 이동과 완전히 분리하여 버튼은 그 자리에서 펼치기/접기만 수행 · 버튼 이외의 게시물 영역은 기존처럼 상세 이동 유지 · 게시물 메뉴 본문 복사 및 본문 길게 눌러 복사 추가 · v0.22.27 이하 기존 기능 유지'
          }
          Path('latest.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('published sha256:',digest)

      - name: Commit app update files
        run: |
          git config user.name 'lenton-update-bot'
          git config user.email 'lenton-update-bot@users.noreply.github.com'
          git add Lenton-v0.22.28.apk latest.json
          if git diff --cached --quiet; then
            echo 'Update files already published.'
            exit 0
          fi
          git commit -m 'Publish Lenton v0.22.28 update'
          git push
