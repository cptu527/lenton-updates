name: Deploy Lenton v0.22.08 updater package

on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/deploy-v02208-once.yml' ]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download exact signed v0.22.08 build artifact
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-2968-8211-b770-ba809e198a55/raw?se=2026-09-04T15%3A03%3A18Z&sp=r&sv=2026-02-06&sr=b&scid=8ed52311-4606-57d3-a0b2-f85c9aa3d959&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T03%3A22%3A12Z&ske=2026-09-05T03%3A22%3A12Z&sks=b&skv=2026-02-06&sig=L0J23cLGraY6v2SJhIEmiS6EbwPcgl0prnufNjZHDSc%3D' -o artifact.zip
          rm -rf artifact
          mkdir artifact
          unzip -q artifact.zip -d artifact
          cp artifact/Lenton-v0.22.08.apk ./Lenton-v0.22.08.apk
          echo 'a2fc1113fe5a615158f96f11f19ed5b1c3bbc1cf9a2515cec3a09ab0d901847d  Lenton-v0.22.08.apk' | sha256sum -c -

      - name: Verify Lenton signing certificate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct
          data=Path('Lenton-v0.22.08.apk').read_bytes()
          eocd=data.rfind(b'PK\x05\x06'); assert eocd>=0
          cd_offset=struct.unpack_from('<4sHHHHIIH',data,eocd)[6]
          size2=struct.unpack_from('<Q',data,cd_offset-24)[0]
          assert data[cd_offset-16:cd_offset]==b'APK Sig Block 42'
          block_start=cd_offset-(size2+8)
          pairs={}; i=block_start+8; end=cd_offset-24
          while i<end:
              length=struct.unpack_from('<Q',data,i)[0]; i+=8
              pair_id=struct.unpack_from('<I',data,i)[0]
              pairs[pair_id]=data[i+4:i+length]; i+=length
          def lp32(buf,off):
              length=struct.unpack_from('<I',buf,off)[0]; start=off+4; finish=start+length
              assert finish<=len(buf)
              return buf[start:finish],finish
          v2=pairs[0x7109871a]
          signers,_=lp32(v2,0); signer,_=lp32(signers,0); signed_data,_=lp32(signer,0)
          _,sd_off=lp32(signed_data,0); certs,_=lp32(signed_data,sd_off); cert,_=lp32(certs,0)
          cert_sha256=hashlib.sha256(cert).hexdigest()
          assert cert_sha256=='fe6fc92cc637bc3fdbd18e98b7c0846b8e489d4c0d0f4e859fc520333f2d8688', cert_sha256
          print('certificate OK:',cert_sha256)
          PY

      - name: Write updater metadata
        run: |
          python3 - <<'PY'
          import json
          info={
            'versionCode':129,
            'versionName':'0.22.08',
            'apkUrl':'https://raw.githubusercontent.com/cptu527/lenton-updates/main/Lenton-v0.22.08.apk',
            'sha256':'a2fc1113fe5a615158f96f11f19ed5b1c3bbc1cf9a2515cec3a09ab0d901847d',
            'notes':'7가지 강조 색상 추가: 블루·핑크·오렌지·퍼플·레드·민트 그린·모노 · 탭/링크/버튼/+ 버튼/업데이트 점/스위치에 선택 색상 적용 · 다크/라이트 모드와 기존 계정 설정·프로필 페이지네이션·답글 확대·키보드·업데이트 기능 유지'
          }
          with open('latest.json','w',encoding='utf-8') as f:
              json.dump(info,f,ensure_ascii=False,indent=2)
              f.write('\n')
          PY
          cat latest.json

      - name: Publish updater package and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/deploy-v02208-once.yml
          git add Lenton-v0.22.08.apk latest.json .github/workflows/deploy-v02208-once.yml
          git commit -m 'Publish Lenton v0.22.08 update'
          git push origin main
