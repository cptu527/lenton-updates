name: Publish Lenton v0.22.41

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v02241.yml'

permissions:
  contents: write

env:
  ARTIFACT_URL_B64: 
  EXPECTED_APK_SHA: 8367d3a056384297322881445f4cd87cc895082f80edcacb89f5102e06404cda

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified build artifact
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_URL="$(printf '%s' "$ARTIFACT_URL_B64" | base64 -d)"
          curl -fL --retry 3 --retry-delay 2 "$ARTIFACT_URL" -o /tmp/lenton-v02241.zip
          rm -rf /tmp/lenton-v02241
          mkdir -p /tmp/lenton-v02241
          unzip -q /tmp/lenton-v02241.zip -d /tmp/lenton-v02241
          test -f /tmp/lenton-v02241/Lenton-v0.22.41.apk
          cp /tmp/lenton-v02241/Lenton-v0.22.41.apk ./Lenton-v0.22.41.apk

      - name: Verify APK and write UTF-8 update metadata
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(sha256sum Lenton-v0.22.41.apk | awk '{print $1}')"
          test "$ACTUAL_SHA" = "$EXPECTED_APK_SHA"
          python3 - <<'PY'
          import json
          data = {
              "versionCode": 162,
              "versionName": "0.22.41",
              "apkUrl": "https://raw.githubusercontent.com/cptu527/lenton-updates/main/Lenton-v0.22.41.apk",
              "sha256": "8367d3a056384297322881445f4cd87cc895082f80edcacb89f5102e06404cda",
              "notes": "문제 신고 이메일 줄바꿈 오류 수정 · 메일 제목과 본문을 실제 문의 접수 양식처럼 정리 · 문의 정보/문의 내용/재현 방법/앱 정보를 구역별로 표시 · 기존 스크린샷 첨부·민감정보 제외·v0.22.40 기능 유지"
          }
          with open("latest.json", "w", encoding="utf-8", newline="\n") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
          cat latest.json

      - name: Publish update and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'lenton-update-bot'
          git config user.email 'cptu527@gmail.com'
          git add Lenton-v0.22.41.apk latest.json
          git rm .github/workflows/publish-v02241.yml
          git commit -m 'Publish Lenton v0.22.41 report email format update'
          git push
