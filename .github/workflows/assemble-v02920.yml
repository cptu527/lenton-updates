name: Assemble production Lenton v0.29.20 APK staging
on:
  push:
    branches: [ release/v02920-staging ]
    paths:
      - .github/workflows/assemble-v02920.yml
      - release-transfer/v02920/**
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and checksum-verify APK
        run: |
          python3 - <<'PY'
          import base64,hashlib,json
          from pathlib import Path
          directory=Path("release-transfer/v02920")
          info=json.loads((directory/"manifest.json").read_text(encoding="utf-8"))
          assert info["versionCode"]==336 and info["versionName"]=="0.29.20" and info["package"]=="com.mastoflow.app"
          encoded="".join((directory/p).read_text(encoding="ascii") for p in info["parts"])
          contents=base64.b64decode(encoded,validate=True)
          assert len(contents)==info["size"]
          assert hashlib.sha256(contents).hexdigest()==info["sha256"],"APK checksum mismatch"
          Path(info["filename"]).write_bytes(contents)
          print("Verified signed production APK",info["filename"],len(contents),info["sha256"])
          PY
      - name: Add verified production APK to staging
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898286+github-actions[bot]@users.noreply.github.com'
          git add -- Lenton-v0.29.20.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Publish signed Lenton v0.29.20 APK to staging'
            git push origin HEAD:release/v02920-staging
          fi
