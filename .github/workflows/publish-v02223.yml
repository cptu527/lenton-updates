name: Publish Lenton v0.22.23

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v02223.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified build artifact
        run: |
          curl --fail --location --retry 3 \
            'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-39e8-8211-9c53-1713b1271d54/raw?se=2026-09-05T06%3A13%3A16Z&sp=r&sv=2026-02-06&sr=b&scid=164777f5-8b2d-56dc-9157-175c09fbfcd3&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T23%3A55%3A49Z&ske=2026-09-05T23%3A55%3A49Z&sks=b&skv=2026-02-06&sig=4rEaITY7SCVd%2BOBrlDTgsk3pDFz7OdsJSsLHHuogbws%3D' \
            --output /tmp/lenton-v02223.zip
          rm -rf /tmp/lenton-v02223
          mkdir -p /tmp/lenton-v02223
          unzip -o /tmp/lenton-v02223.zip -d /tmp/lenton-v02223
          test -f /tmp/lenton-v02223/Lenton-v0.22.23.apk
          cp /tmp/lenton-v02223/Lenton-v0.22.23.apk ./Lenton-v0.22.23.apk

      - name: Verify APK hash and publish metadata
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json
          apk=Path('Lenton-v0.22.23.apk')
          digest=hashlib.sha256(apk.read_bytes()).hexdigest()
          expected='aa3c14a14380348abef520322a96a4e4f1bcdb20c40f4260cd5a20a1002ed2ba'
          assert digest==expected,(digest,expected)
          meta={
              'versionCode':144,
              'versionName':'0.22.23',
              'apkUrl':'https://raw.githubusercontent.com/cptu527/lenton-updates/main/Lenton-v0.22.23.apk',
              'sha256':digest,
              'notes':'프로필의 계정 ID에 서버 도메인을 함께 표시(@아이디@서버) · 사이드 메뉴 현재 계정과 계정 전환 목록에도 서버 표시 · 원격 계정은 기존 도메인을 중복 추가하지 않음 · v0.22.22 인앱 로그인 및 기존 기능 유지'
          }
          Path('latest.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('published sha256:',digest)

      - name: Commit app update files
        run: |
          git config user.name 'lenton-update-bot'
          git config user.email 'lenton-update-bot@users.noreply.github.com'
          git add Lenton-v0.22.23.apk latest.json
          if git diff --cached --quiet; then
            echo 'Update files already published.'
            exit 0
          fi
          git commit -m 'Publish Lenton v0.22.23 update'
          git push
