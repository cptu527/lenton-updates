name: Publish Lenton v0.23.03

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v02303.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact verified v0.23.03 artifact
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-662c-8211-abdc-ffe4c1090528/raw?se=2026-09-06T13%3A28%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=0ed81e90-518f-5e60-a140-3c97cdd1a943&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-06T06%3A46%3A51Z&ske=2026-09-07T06%3A46%3A51Z&sks=b&skv=2026-02-06&sig=X9n02S0Z/0JAafBGMZPz/drjWp5bzzQTBXxtyykANhQ%3D' -o artifact.zip
          unzip -o artifact.zip
          test -f Lenton-v0.23.03.apk
          actual="$(sha256sum Lenton-v0.23.03.apk | awk '{print $1}')"
          expected='38aa0088e74d6293ee5f7d425d342267004d4972401e8ed4b28067f3b5dbbfa7'
          echo "APK_SHA256=$actual"
          test "$actual" = "$expected"

      - name: Write UTF-8 update metadata
        run: |
          python3 - <<'PY'
          import json
          data = {
            "versionCode": 167,
            "versionName": "0.23.03",
            "apkUrl": "https://raw.githubusercontent.com/cptu527/lenton-updates/main/Lenton-v0.23.03.apk",
            "sha256": "38aa0088e74d6293ee5f7d425d342267004d4972401e8ed4b28067f3b5dbbfa7",
            "notes": "DM 현재 타래 우선 로딩 최적화 · 같은 상대의 오래된 타래는 백그라운드 병합 · DM 입력창 남은 글자 수 실시간 표시 · 기존 타래 분리/이전 공개 대화 보기/실시간 DM 및 기존 기능 유지"
          }
          with open('latest.json','w',encoding='utf-8') as f:
            json.dump(data,f,ensure_ascii=False,indent=2)
            f.write('\n')
          PY
          cat latest.json

      - name: Publish APK and latest.json
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Lenton-v0.23.03.apk latest.json
          git rm .github/workflows/publish-v02303.yml
          git commit -m 'Publish Lenton v0.23.03 DM optimization and counter'
          git push origin HEAD:main
