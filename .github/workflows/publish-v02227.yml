name: Publish Lenton v0.22.27

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v02227.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified build artifact
        run: |
          curl --fail --location --retry 3 \
            'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-4edc-8211-b771-6974c28cb909/raw?se=2026-09-05T07%3A28%3A37Z&sp=r&sv=2026-02-06&sr=b&scid=08ecf231-4c50-5a1e-b189-e99152128267&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-05T00%3A46%3A41Z&ske=2026-09-06T00%3A46%3A41Z&sks=b&skv=2026-02-06&sig=A1FCFhultGN%2B39D1kOpp8vUVvc19Mbue86/xqqdnqyo%3D' \
            --output /tmp/lenton-v02227.zip
          rm -rf /tmp/lenton-v02227
          mkdir -p /tmp/lenton-v02227
          unzip -o /tmp/lenton-v02227.zip -d /tmp/lenton-v02227
          test -f /tmp/lenton-v02227/Lenton-v0.22.27.apk
          cp /tmp/lenton-v02227/Lenton-v0.22.27.apk ./Lenton-v0.22.27.apk

      - name: Verify APK hash and publish metadata
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json
          apk=Path('Lenton-v0.22.27.apk')
          digest=hashlib.sha256(apk.read_bytes()).hexdigest()
          expected='4857331a55e3f37ef22519cede8cb4ecbf311d2bcc87a9836fea42f229d9f49d'
          assert digest==expected,(digest,expected)
          meta={
              'versionCode':148,
              'versionName':'0.22.27',
              'apkUrl':'https://raw.githubusercontent.com/cptu527/lenton-updates/main/Lenton-v0.22.27.apk',
              'sha256':digest,
              'notes':'+ 타래의 각 게시물마다 CW를 따로 켜고 경고 문구를 지정할 수 있도록 수정 · CW 더보기/숨기기는 그 자리에서 펼치기/접기만 하고 게시물 상세로 이동하지 않도록 수정 · 게시물 메뉴 본문 복사 및 본문 길게 눌러 복사 추가 · v0.22.26 이하 기존 기능 유지'
          }
          Path('latest.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('published sha256:',digest)

      - name: Commit app update files
        run: |
          git config user.name 'lenton-update-bot'
          git config user.email 'lenton-update-bot@users.noreply.github.com'
          git add Lenton-v0.22.27.apk latest.json
          if git diff --cached --quiet; then
            echo 'Update files already published.'
            exit 0
          fi
          git commit -m 'Publish Lenton v0.22.27 update'
          git push
