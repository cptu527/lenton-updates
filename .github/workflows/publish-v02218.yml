name: Publish Lenton v0.22.18

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v02218.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified build artifact
        run: |
          curl --fail --location --retry 3 \
            'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-9394-8211-b7e4-d48aa3d57730/raw?se=2026-09-05T04%3A44%3A35Z&sp=r&sv=2026-02-06&sr=b&scid=fdb93558-5d71-5725-9bc1-9afe1aca56b8&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-05T02%3A20%3A35Z&ske=2026-09-06T02%3A20%3A35Z&sks=b&skv=2026-02-06&sig=R9VqWD4%2BWU7Nz9rtTFbJCTeFLt4evMHXkPgwI2zGe6s%3D' \
            --output /tmp/lenton-v02218.zip
          mkdir -p /tmp/lenton-v02218
          unzip -o /tmp/lenton-v02218.zip -d /tmp/lenton-v02218
          test -f /tmp/lenton-v02218/Lenton-v0.22.18.apk
          cp /tmp/lenton-v02218/Lenton-v0.22.18.apk ./Lenton-v0.22.18.apk

      - name: Verify APK hash and publish metadata
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json
          apk = Path('Lenton-v0.22.18.apk')
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          expected = 'd234b64edbd454d6b994a75f9bbbaddda33bf1c3dcdd8d7c15bbdfa7954459a5'
          assert digest == expected, (digest, expected)
          meta = {
              'versionCode': 139,
              'versionName': '0.22.18',
              'apkUrl': 'https://raw.githubusercontent.com/cptu527/lenton-updates/main/Lenton-v0.22.18.apk',
              'sha256': digest,
              'notes': '퍼블릭 요청이 정상 응답이어도 빈 결과면 기존 정상 퍼블릭 캐시를 지우지 않도록 수정 · 이미 빈 캐시로 덮인 경우 시간순 캐시에서 퍼블릭 게시물을 복구 · 새로고침도 동일 보호 적용 · v0.22.17 및 기존 기능 유지'
          }
          Path('latest.json').write_text(json.dumps(meta, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('published sha256:', digest)

      - name: Commit app update files
        run: |
          git config user.name 'lenton-update-bot'
          git config user.email 'lenton-update-bot@users.noreply.github.com'
          git add Lenton-v0.22.18.apk latest.json
          if git diff --cached --quiet; then
            echo 'Update files already published.'
            exit 0
          fi
          git commit -m 'Publish Lenton v0.22.18 update'
          git push
