name: Deploy Lenton v0.22.09 updater package

on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/deploy-v02209-once.yml' ]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download exact signed v0.22.09 build artifact
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-c93c-8211-8a56-b4c0a8afaf37/raw?se=2026-09-04T16%3A34%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=eec05428-6253-5f6f-9ee4-b571c8f52f79&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T03%3A12%3A55Z&ske=2026-09-05T03%3A12%3A55Z&sks=b&skv=2026-02-06&sig=r1NYQUUVudDcJJV0kyMBb%2BX9j4rYeE28HxOGNmh4kuk%3D' -o artifact.zip
          rm -rf artifact
          mkdir artifact
          unzip -q artifact.zip -d artifact
          cp artifact/Lenton-v0.22.09.apk ./Lenton-v0.22.09.apk
          echo 'a035e1cdfbef75d0dc772715f046ad98b6fc7216e4d7551b441849e65e486b1e  Lenton-v0.22.09.apk' | sha256sum -c -

      - name: Verify Lenton signing certificate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct
          data=Path('Lenton-v0.22.09.apk').read_bytes()
          eocd=data.rfind(b'PK\x05\x06'); assert eocd>=0
          cd_offset=struct.unpack_from('<4sHHHHIIH',data,eocd)[6]
          size2=struct.unpack_from('<Q',data,cd_offset-24)[0]
          assert data[cd_offset-16:cd_offset]==b'APK Sig Block 42'
          block_start=cd_offset-(size2+8)
          pairs={}; i=block_start+8; end=cd_offset-24
          while i<end:
              length=struct.unpack_from('<Q',data,i)[0]; i+=8
              pair_id=struct.unpack_from('<I',data,i)[0]
              pairs[pair_id]=data[i+4:i+length]; i+=length
          def lp32(buf,off):
              length=struct.unpack_from('<I',buf,off)[0]; start=off+4; finish=start+length
              assert finish<=len(buf)
              return buf[start:finish],finish
          v2=pairs[0x7109871a]
          signers,_=lp32(v2,0); signer,_=lp32(signers,0); signed_data,_=lp32(signer,0)
          _,sd_off=lp32(signed_data,0); certs,_=lp32(signed_data,sd_off); cert,_=lp32(certs,0)
          cert_sha256=hashlib.sha256(cert).hexdigest()
          assert cert_sha256=='fe6fc92cc637bc3fdbd18e98b7c0846b8e489d4c0d0f4e859fc520333f2d8688', cert_sha256
          print('certificate OK:',cert_sha256)
          PY

      - name: Write updater metadata
        run: |
          python3 - <<'PY'
          import json
          info={
            'versionCode':130,
            'versionName':'0.22.09',
            'apkUrl':'https://raw.githubusercontent.com/cptu527/lenton-updates/main/Lenton-v0.22.09.apk',
            'sha256':'a035e1cdfbef75d0dc772715f046ad98b6fc7216e4d7551b441849e65e486b1e',
            'notes':'새 버전을 앱 시작/사이드 메뉴에서 빠르게 조용히 확인해 업데이트 강조색 점 즉시 표시 · 다른 계정에 새 알림이 오면 사이드 메뉴 계정 프로필 사진에 강조색 알림 점 표시하고 해당 계정 알림 확인 시 제거 · 기존 7가지 강조 색상과 모든 기존 기능 유지'
          }
          with open('latest.json','w',encoding='utf-8') as f:
              json.dump(info,f,ensure_ascii=False,indent=2)
              f.write('\n')
          PY
          cat latest.json

      - name: Publish updater package and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/deploy-v02209-once.yml
          git add Lenton-v0.22.09.apk latest.json .github/workflows/deploy-v02209-once.yml
          git commit -m 'Publish Lenton v0.22.09 update'
          git push origin main
