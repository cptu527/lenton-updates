name: Publish Lenton v0.22.25

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v02225.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified build artifact
        run: |
          curl --fail --location --retry 3 \
            'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-9b2c-8211-8036-a8c43e6bf7f1/raw?se=2026-09-05T06%3A59%3A05Z&sp=r&sv=2026-02-06&sr=b&scid=a322c09f-4e36-5ad9-af53-35137cf0375d&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-05T02%3A20%3A35Z&ske=2026-09-06T02%3A20%3A35Z&sks=b&skv=2026-02-06&sig=hpU3cp4q5vOFZZy19JUguxKoYcRB1WWeLoBsrtQbntM%3D' \
            --output /tmp/lenton-v02225.zip
          rm -rf /tmp/lenton-v02225
          mkdir -p /tmp/lenton-v02225
          unzip -o /tmp/lenton-v02225.zip -d /tmp/lenton-v02225
          test -f /tmp/lenton-v02225/Lenton-v0.22.25.apk
          cp /tmp/lenton-v02225/Lenton-v0.22.25.apk ./Lenton-v0.22.25.apk

      - name: Verify APK hash and publish metadata
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json
          apk=Path('Lenton-v0.22.25.apk')
          digest=hashlib.sha256(apk.read_bytes()).hexdigest()
          expected='275df78dabef75c15a2846da9872a3751935cb3669cceb4fc662fb4a302291ef'
          assert digest==expected,(digest,expected)
          meta={
              'versionCode':146,
              'versionName':'0.22.25',
              'apkUrl':'https://raw.githubusercontent.com/cptu527/lenton-updates/main/Lenton-v0.22.25.apk',
              'sha256':digest,
              'notes':'모노(검정 강조색) 테마에서 @멘션 태그를 실제로 살짝 두껍게 표시하도록 조건 수정 · v0.22.24의 다크모드 조건 오류 수정 · 일반 링크/다른 강조색/기존 기능 유지'
          }
          Path('latest.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('published sha256:',digest)

      - name: Commit app update files
        run: |
          git config user.name 'lenton-update-bot'
          git config user.email 'lenton-update-bot@users.noreply.github.com'
          git add Lenton-v0.22.25.apk latest.json
          if git diff --cached --quiet; then
            echo 'Update files already published.'
            exit 0
          fi
          git commit -m 'Publish Lenton v0.22.25 update'
          git push
