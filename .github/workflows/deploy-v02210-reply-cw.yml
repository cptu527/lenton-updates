name: Deploy Lenton v0.22.10 reply CW

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/deploy-v02210-reply-cw.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download verified build artifact
        env:
          ARTIFACT_URL: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-8c74-8211-aff9-757664617766/raw?se=2026-09-04T18%3A42%3A35Z&sp=r&sv=2026-02-06&sr=b&scid=d406e792-67b0-50ff-970c-3691b1276314&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T03%3A01%3A44Z&ske=2026-09-05T03%3A01%3A44Z&sks=b&skv=2026-02-06&sig=Ml6n8ZcLyPIJHuzT2mvJlwTUW8j8UGOMgZT%2BHbctOsk%3D'
        run: |
          set -euo pipefail
          curl -fL --retry 3 "$ARTIFACT_URL" -o artifact.zip
          rm -rf artifact-unpack
          mkdir artifact-unpack
          unzip -q artifact.zip -d artifact-unpack
          test -f artifact-unpack/Lenton-v0.22.10.apk
          echo '55bacb508444be72eb808a9467357168c8e033eb8b31f2ab570ef3e8d79ce094  artifact-unpack/Lenton-v0.22.10.apk' | sha256sum -c -
          cp artifact-unpack/Lenton-v0.22.10.apk ./Lenton-v0.22.10.apk

      - name: Write updater metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          meta = {
              "versionCode": 131,
              "versionName": "0.22.10",
              "apkUrl": "https://raw.githubusercontent.com/cptu527/lenton-updates/main/Lenton-v0.22.10.apk",
              "sha256": "55bacb508444be72eb808a9467357168c8e033eb8b31f2ab570ef3e8d79ce094",
              "notes": "내 답글에 다시 답할 때 타래의 실제 상대를 계속 답글 대상으로 유지 · 답글 대상 안내를 입력창 안으로 이동 · 전체 답글 작성창에서 GIF/투표 버튼 제거 · CW 버튼으로 실제 콘텐츠 경고 입력 및 spoiler_text 전송 · v0.22.09 기존 기능 유지"
          }
          Path("latest.json").write_text(json.dumps(meta, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          cat latest.json

      - name: Commit updater release
        run: |
          set -euo pipefail
          git config user.name 'Lenton Build'
          git config user.email 'actions@users.noreply.github.com'
          git add Lenton-v0.22.10.apk latest.json
          if git diff --cached --quiet; then
            echo 'Updater files already current'
            exit 0
          fi
          git commit -m 'Deploy Lenton v0.22.10'
          git push origin HEAD:main
