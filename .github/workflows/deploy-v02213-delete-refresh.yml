name: Deploy Lenton v0.22.13 Delete Refresh

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/deploy-v02213-delete-refresh.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download verified build artifact
        env:
          ARTIFACT_URL: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-36b8-8211-a3ee-8f5bc8abe165/raw?se=2026-09-05T02%3A24%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=71f48c71-89a3-5743-96f5-34c3b16842ab&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-05T01%3A32%3A55Z&ske=2026-09-06T01%3A32%3A55Z&sks=b&skv=2026-02-06&sig=sMrmS/0OY5kvEtD67myO9Exa8gY9swIywCcjkGVIvCI%3D'
        run: |
          set -euo pipefail
          curl -fL --retry 3 "$ARTIFACT_URL" -o artifact.zip
          rm -rf artifact-unpack
          mkdir artifact-unpack
          unzip -q artifact.zip -d artifact-unpack
          test -f artifact-unpack/Lenton-v0.22.13.apk
          echo '8dd7b926f67c905fb327cd160aefb14fcf7768e104bcf25dcffb35e38a8259d4  artifact-unpack/Lenton-v0.22.13.apk' | sha256sum -c -
          cp artifact-unpack/Lenton-v0.22.13.apk ./Lenton-v0.22.13.apk

      - name: Write updater metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          meta = {
              "versionCode": 134,
              "versionName": "0.22.13",
              "apkUrl": "https://raw.githubusercontent.com/cptu527/lenton-updates/main/Lenton-v0.22.13.apk",
              "sha256": "8dd7b926f67c905fb327cd160aefb14fcf7768e104bcf25dcffb35e38a8259d4",
              "notes": "홈 새로고침 시 서버 목록을 다시 받아 삭제된 게시물까지 반영 · 내 게시물 삭제 성공 즉시 홈 목록/캐시에서도 제거 · 상세에서 삭제 후 돌아와도 재등장하지 않음 · v0.22.12 기존 기능 유지"
          }
          Path("latest.json").write_text(json.dumps(meta, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          cat latest.json

      - name: Commit updater release
        run: |
          set -euo pipefail
          git config user.name 'Lenton Build'
          git config user.email 'actions@users.noreply.github.com'
          git add Lenton-v0.22.13.apk latest.json
          if git diff --cached --quiet; then
            echo 'Updater files already current'
            exit 0
          fi
          git commit -m 'Deploy Lenton v0.22.13'
          git push origin HEAD:main
