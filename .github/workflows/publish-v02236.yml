name: Publish Lenton v0.22.36

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v02236.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v0.22.36 build artifact
        env:
          ARTIFACT_URL_B64: 
        run: |
          ARTIFACT_URL="$(printf '%s' "$ARTIFACT_URL_B64" | base64 -d)"
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output /tmp/lenton-v02236.zip
          rm -rf /tmp/lenton-v02236
          mkdir -p /tmp/lenton-v02236
          unzip -o /tmp/lenton-v02236.zip -d /tmp/lenton-v02236
          test -f /tmp/lenton-v02236/Lenton-v0.22.36.apk
          cp /tmp/lenton-v02236/Lenton-v0.22.36.apk ./Lenton-v0.22.36.apk

      - name: Verify APK and write updater metadata
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json
          apk = Path('Lenton-v0.22.36.apk')
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          expected = '6850add5484def8e2d16e701318110f4e4f2e0d677ed444eac36067ba35033f1'
          assert digest == expected, (digest, expected)
          meta = {
              'versionCode': 157,
              'versionName': '0.22.36',
              'apkUrl': 'https://raw.githubusercontent.com/cptu527/lenton-updates/main/Lenton-v0.22.36.apk',
              'sha256': digest,
              'notes': '게시물 본문의 좋아요 숫자를 누르면 좋아요한 계정 목록 표시 · 좋아요 0→1 변경 뒤에도 새로고침 없이 참여자 목록 터치 유지 · 좋아요 숫자 터치 영역 확대 · 하트 짧게 누르기 좋아요/취소는 기존 유지 · v0.22.35 로그인 앱 아이콘과 이전 기능 모두 유지'
          }
          Path('latest.json').write_text(json.dumps(meta, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('verified apk sha256:', digest)

      - name: Publish update and remove temporary workflow
        run: |
          git config user.name 'lenton-update-bot'
          git config user.email 'lenton-update-bot@users.noreply.github.com'
          git add Lenton-v0.22.36.apk latest.json
          git rm .github/workflows/publish-v02236.yml
          git commit -m 'Publish Lenton v0.22.36 update'
          git push
