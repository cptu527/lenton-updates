name: Deploy Lenton v0.22.12 CW Composer Inline

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/deploy-v02212-cw-composer-inline.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download verified build artifact
        env:
          ARTIFACT_URL: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-53ac-8211-bb51-349759e37b02/raw?se=2026-09-05T01%3A26%3A44Z&sp=r&sv=2026-02-06&sr=b&scid=9218e2a5-cc8c-5690-ad6c-6e5043160721&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T23%3A55%3A49Z&ske=2026-09-05T23%3A55%3A49Z&sks=b&skv=2026-02-06&sig=0QSYp/0h%2BmSJeMRRfXbDATOFtka%2B5nbdg4AneR%2BKiwQ%3D'
        run: |
          set -euo pipefail
          curl -fL --retry 3 "$ARTIFACT_URL" -o artifact.zip
          rm -rf artifact-unpack
          mkdir artifact-unpack
          unzip -q artifact.zip -d artifact-unpack
          test -f artifact-unpack/Lenton-v0.22.12.apk
          echo '461c72848c7ca1d5438b1129f7f78fc1b82aef05335f19fec8faba6ae6d5f906  artifact-unpack/Lenton-v0.22.12.apk' | sha256sum -c -
          cp artifact-unpack/Lenton-v0.22.12.apk ./Lenton-v0.22.12.apk

      - name: Write updater metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          meta = {
              "versionCode": 133,
              "versionName": "0.22.12",
              "apkUrl": "https://raw.githubusercontent.com/cptu527/lenton-updates/main/Lenton-v0.22.12.apk",
              "sha256": "461c72848c7ca1d5438b1129f7f78fc1b82aef05335f19fec8faba6ae6d5f906",
              "notes": "CW 제목 입력칸을 본문 위로 이동 · 홈 화면에서 CW 더보기를 누르면 상세로 이동하지 않고 본문을 바로 펼침 · 펼친 뒤 숨기기로 다시 접기 유지 · v0.22.11 기존 기능 유지"
          }
          Path("latest.json").write_text(json.dumps(meta, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          cat latest.json

      - name: Commit updater release
        run: |
          set -euo pipefail
          git config user.name 'Lenton Build'
          git config user.email 'actions@users.noreply.github.com'
          git add Lenton-v0.22.12.apk latest.json
          if git diff --cached --quiet; then
            echo 'Updater files already current'
            exit 0
          fi
          git commit -m 'Deploy Lenton v0.22.12'
          git push origin HEAD:main
