name: Publish Lenton v0.22.35

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v02235.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v0.22.35 build artifact
        env:
          ARTIFACT_URL_B64: 
        run: |
          ARTIFACT_URL="$(printf '%s' "$ARTIFACT_URL_B64" | base64 -d)"
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output /tmp/lenton-v02235.zip
          rm -rf /tmp/lenton-v02235
          mkdir -p /tmp/lenton-v02235
          unzip -o /tmp/lenton-v02235.zip -d /tmp/lenton-v02235
          test -f /tmp/lenton-v02235/Lenton-v0.22.35.apk
          cp /tmp/lenton-v02235/Lenton-v0.22.35.apk ./Lenton-v0.22.35.apk

      - name: Verify APK and write updater metadata
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json
          apk = Path('Lenton-v0.22.35.apk')
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          expected = 'e7f73c3f75dc72e50a55ef02818ea32aba20068a1fd0bacad6d68543e7c26df8'
          assert digest == expected, (digest, expected)
          meta = {
              'versionCode': 156,
              'versionName': '0.22.35',
              'apkUrl': 'https://raw.githubusercontent.com/cptu527/lenton-updates/main/Lenton-v0.22.35.apk',
              'sha256': digest,
              'notes': '첫 로그인 및 계정 추가의 Mastodon m 표시를 현재 렌톤 앱 아이콘으로 교체 · 런처 아이콘 자체와 OAuth/계정 추가 흐름은 그대로 유지 · v0.22.34 이하 기존 기능 유지'
          }
          Path('latest.json').write_text(json.dumps(meta, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('verified apk sha256:', digest)

      - name: Publish update and remove temporary workflow
        run: |
          git config user.name 'lenton-update-bot'
          git config user.email 'lenton-update-bot@users.noreply.github.com'
          git add Lenton-v0.22.35.apk latest.json
          git rm .github/workflows/publish-v02235.yml
          git commit -m 'Publish Lenton v0.22.35 update'
          git push
