name: Publish Lenton v0.23.07 updater package

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v02307-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v0.23.07 build artifact
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-76e4-8211-9ef3-5fd52f2cd2e8/raw?se=2026-09-07T11%3A22%3A33Z&sp=r&sv=2026-02-06&sr=b&scid=1ffa623f-685d-5878-8421-2f6ad84db497&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-07T00%3A47%3A37Z&ske=2026-09-08T00%3A47%3A37Z&sks=b&skv=2026-02-06&sig=AJmdFHs0q0BhIrWk9Gx2RmMxcC4fQ5CLyxTk%2ByMlQmk%3D' \
            -o /tmp/Lenton-v0.23.07-artifact.zip
          unzip -o /tmp/Lenton-v0.23.07-artifact.zip Lenton-v0.23.07.apk -d .

      - name: Verify APK SHA-256
        run: |
          echo 'd82508b4320131ddc774657003ef49cf8cf7840466b12dae45eae24cda425db1  Lenton-v0.23.07.apk' | sha256sum -c -

      - name: Write updater metadata in UTF-8
        run: |
          python3 - <<'PY'
          import json
          meta = {
              'versionCode': 171,
              'versionName': '0.23.07',
              'apkUrl': 'https://raw.githubusercontent.com/cptu527/lenton-updates/main/Lenton-v0.23.07.apk',
              'sha256': 'd82508b4320131ddc774657003ef49cf8cf7840466b12dae45eae24cda425db1',
              'notes': '계정 설정에 로그인 이메일 메모 추가 · 캐릭터/계정별로 직접 입력·수정 가능 · 이메일은 이 기기에만 저장되고 마스토돈/OAuth/문제 신고로 자동 전송하지 않음 · v0.23.06 구형 삼성 설치 호환성과 기존 기능 유지'
          }
          with open('latest.json', 'w', encoding='utf-8', newline='\n') as f:
              json.dump(meta, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY

      - name: Commit updater package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Lenton-v0.23.07.apk latest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish Lenton v0.23.07 updater package'
          git push
