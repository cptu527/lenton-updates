name: Deploy Lenton v0.22.14 API Throttle

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/deploy-v02214-api-throttle.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download verified v0.22.14 artifact
        env:
          ARTIFACT_URL: 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-6bec-8211-a5cb-1bf2b622cb10/raw?se=2026-09-05T02%3A49%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=060e956d-40c7-5447-94e3-e0d15fb28d78&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T23%3A13%3A41Z&ske=2026-09-05T23%3A13%3A41Z&sks=b&skv=2026-02-06&sig=T84o71pg8%2B0zOugDGci03ueKw6FusLPYqzds17hEn8s%3D'
        run: |
          set -euo pipefail
          curl -fL --retry 3 "$ARTIFACT_URL" -o artifact.zip
          rm -rf artifact-unpack
          mkdir artifact-unpack
          unzip -q artifact.zip -d artifact-unpack
          test -f artifact-unpack/Lenton-v0.22.14.apk
          echo '90d96f2e67d32d9e45a654c66196844c53adc38a2c416cc960d9f2865c65a1c7  artifact-unpack/Lenton-v0.22.14.apk' | sha256sum -c -
          cp artifact-unpack/Lenton-v0.22.14.apk ./Lenton-v0.22.14.apk
      - name: Write updater metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          meta = {
              "versionCode": 135,
              "versionName": "0.22.14",
              "apkUrl": "https://raw.githubusercontent.com/cptu527/lenton-updates/main/Lenton-v0.22.14.apk",
              "sha256": "90d96f2e67d32d9e45a654c66196844c53adc38a2c416cc960d9f2865c65a1c7",
              "notes": "API 요청 중복 방지 · 429 서버 대기시간 정확히 준수 · 실시간 알림 중복 폴링 제거 · 홈/배지 새로고침 과호출 완화 · v0.22.13 기존 기능 유지"
          }
          Path('latest.json').write_text(json.dumps(meta, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
          cat latest.json
      - name: Commit updater release
        run: |
          set -euo pipefail
          git config user.name 'Lenton Build'
          git config user.email 'actions@users.noreply.github.com'
          git add Lenton-v0.22.14.apk latest.json
          if git diff --cached --quiet; then
            echo 'Updater files already current'
            exit 0
          fi
          git commit -m 'Deploy Lenton v0.22.14'
          git push origin HEAD:main
