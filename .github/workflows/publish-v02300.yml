name: Publish Lenton v0.23.00

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v02300.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download verified v0.23.00 build artifact
        env:
          ARTIFACT_URL: 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-7348-8206-9e5c-9412b3709af8/raw?se=2026-09-06T02%3A36%3A33Z&sp=r&sv=2026-02-06&sr=b&scid=b64264fb-eb4f-54b3-9fe3-062bf2af6800&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-06T01%3A27%3A08Z&ske=2026-09-07T01%3A27%3A08Z&sks=b&skv=2026-02-06&sig=BCc1%2Bk40ZxouoZ1XyF8zyGxhU17RbnTAPqc9J9pskmU%3D'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" -o v02300.zip
          rm -rf v02300
          mkdir v02300
          unzip -q v02300.zip -d v02300
          test -f v02300/Lenton-v0.23.00.apk
          test -f v02300/latest.json
          echo 'ebcb83813d14ffe01316e09abf69f87b9aca220eeed3b5eeb19afc335f12fbc6  v02300/Lenton-v0.23.00.apk' | sha256sum -c -
          cp v02300/Lenton-v0.23.00.apk ./Lenton-v0.23.00.apk
          cp v02300/latest.json ./latest.json

      - name: Verify update manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('latest.json')
          raw=p.read_text(encoding='utf-8-sig')
          d=json.loads(raw)
          assert d['versionCode']==164
          assert d['versionName']=='0.23.00'
          assert d['sha256']=='ebcb83813d14ffe01316e09abf69f87b9aca220eeed3b5eeb19afc335f12fbc6'
          assert d['apkUrl']=='https://raw.githubusercontent.com/cptu527/lenton-updates/main/Lenton-v0.23.00.apk'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Publish APK and latest.json
        run: |
          set -euo pipefail
          git config user.name 'lenton-update-bot'
          git config user.email 'cptu527@gmail.com'
          git add Lenton-v0.23.00.apk latest.json
          git rm .github/workflows/publish-v02300.yml
          git commit -m 'Publish Lenton v0.23.00 DM thread list update'
          git push origin HEAD:main
