name: Prepare Android tooling for v0.22.01

on:
  push:
    paths:
      - '.github/workflows/tooling-v02201-once.yml'

permissions:
  contents: write

jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - name: Install build tools
        run: sdkmanager 'build-tools;35.0.1'
      - name: Fetch apktool
        run: |
          curl -fL --retry 3 'https://repo.maven.apache.org/maven2/org/apktool/apktool-cli/2.9.3/apktool-cli-2.9.3-all.jar' -o apktool.jar
          test -s apktool.jar
      - name: Collect tools
        run: |
          mkdir tooling
          cp apktool.jar tooling/apktool.jar
          cp "$ANDROID_HOME/build-tools/35.0.1/lib/apksigner.jar" tooling/apksigner.jar
          cp "$ANDROID_HOME/build-tools/35.0.1/zipalign" tooling/zipalign
          chmod +x tooling/zipalign
          ls -lh tooling
      - uses: actions/upload-artifact@v4
        with:
          name: lenton-v02201-tooling
          path: tooling
          if-no-files-found: error
      - name: Remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tooling-v02201-once.yml
          git commit -m 'Remove one-shot v0.22.01 tooling workflow'
          git push
