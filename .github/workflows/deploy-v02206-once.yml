name: Deploy Lenton v0.22.06 updater package

on:
  push:
    paths:
      - '.github/workflows/deploy-v02206-once.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download exact signed v0.22.06 build artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-4640-8211-b388-fd2881a4a501/raw?se=2026-09-04T13%3A28%3A06Z&sp=r&sv=2026-02-06&sr=b&scid=5e159226-8beb-55a9-98b1-7cc4e03a01ed&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-04T03%3A04%3A07Z&ske=2026-09-05T03%3A04%3A07Z&sks=b&skv=2026-02-06&sig=qBinvsvBOHBgs3TzyJ1R0MjTbzfhRGxLW3VvrvHtm3U%3D' -o artifact.zip
          echo '5ef1ce6f7c9d2e7d24bfbf8292e4a0a1509714a490d11882c1c9d7dea850c0b0  artifact.zip' | sha256sum -c -
          unzip -o artifact.zip
          echo '3700631f7161b13b7ccb29fadc6a4faa3afff3f6e39ac5834bf502a6e1da532e  Lenton-v0.22.06.apk' | sha256sum -c -

      - name: Verify Lenton signing certificate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, struct
          data=Path('Lenton-v0.22.06.apk').read_bytes()
          assert hashlib.sha256(data).hexdigest()=='3700631f7161b13b7ccb29fadc6a4faa3afff3f6e39ac5834bf502a6e1da532e'
          eocd=data.rfind(b'PK\x05\x06'); assert eocd>=0
          cd_offset=struct.unpack_from('<4sHHHHIIH',data,eocd)[6]
          size2=struct.unpack_from('<Q',data,cd_offset-24)[0]
          assert data[cd_offset-16:cd_offset]==b'APK Sig Block 42'
          block_start=cd_offset-(size2+8)
          pairs={}; i=block_start+8; end=cd_offset-24
          while i<end:
              length=struct.unpack_from('<Q',data,i)[0]; i+=8
              pair_id=struct.unpack_from('<I',data,i)[0]
              pairs[pair_id]=data[i+4:i+length]; i+=length
          def lp32(buf,off):
              length=struct.unpack_from('<I',buf,off)[0]; start=off+4; finish=start+length
              assert finish<=len(buf)
              return buf[start:finish],finish
          v2=pairs[0x7109871a]
          signers,_=lp32(v2,0); signer,_=lp32(signers,0); signed_data,_=lp32(signer,0)
          _,sd_off=lp32(signed_data,0); certs,_=lp32(signed_data,sd_off); cert,_=lp32(certs,0)
          cert_sha=hashlib.sha256(cert).hexdigest()
          assert cert_sha=='fe6fc92cc637bc3fdbd18e98b7c0846b8e489d4c0d0f4e859fc520333f2d8688',cert_sha
          print('certificate matches installed Lenton:',cert_sha)
          PY

      - name: Write updater metadata
        shell: bash
        run: |
          cat > latest.json <<'JSON'
          {
            "versionCode": 127,
            "versionName": "0.22.06",
            "apkUrl": "https://raw.githubusercontent.com/cptu527/lenton-updates/main/Lenton-v0.22.06.apk",
            "sha256": "3700631f7161b13b7ccb29fadc6a4faa3afff3f6e39ac5834bf502a6e1da532e",
            "notes": "계정 설정의 ‘미디어를 항상 민감함으로 표시’와 ‘계정 잠금’을 휴대폰 알림과 같은 스위치로 변경 · 토글 후 화면이 맨 위로 이동하는 현상 제거 · 새 업데이트가 확인되면 사이드 메뉴 ‘앱 업데이트’ 오른쪽에 파란 점 표시 · 기존 설정/프로필 페이지네이션/답글 확대/키보드/업데이트 기능 유지"
          }
          JSON

      - name: Publish updater package and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/deploy-v02206-once.yml
          rm -f artifact.zip
          git add Lenton-v0.22.06.apk latest.json
          git commit -m 'Publish Lenton v0.22.06 updater package'
          git push
